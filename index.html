<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de paletas interactivo</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header-title">Generador de paletas de colores</h1>
      <p class="header-description">
        Creá una paleta aleatoria de forma rápida y sencilla.
      </p>
    </header>

    <main class="main">
      <section class="section-main">
        <h2 class="section-title">Configuración de la paleta</h2>

        <div class="configuration-container">
          <div class="configuration-option">
            <label for="cantidad-colores">Cantidad de colores:</label>
            <select
              name="cantidad-colores"
              id="cantidad-colores"
              class="color-count-select"
            >
              <option class="option-select" value="6">6</option>
              <option class="option-select" value="8">8</option>
              <option class="option-select" value="9">9</option>
            </select>
          </div>

          <div class="configuration-option">
            <label for="formato-colores">Formato de colores:</label>
            <select
              name="formato-colores"
              id="formato-colores"
              class="color-formato-select"
            >
              <option class="option-select" value="hsl">HSL</option>
              <option class="option-select" value="hex">HEX</option>
            </select>
          </div>

          <button
            type="button"
            class="generate-button"
            id="generate-btn"
            aria-label="Generar una nueva paleta de colores"
          >
            Generar paleta
          </button>

          <button type="button" class="save-button" id="save-btn">
            Guardar paleta
          </button>

          <button
            type="button"
            class="saved-palettes-button"
            id="saved-palettes-btn"
          >
            Paletas guardadas
          </button>
        </div>
      </section>

      <section class="section-palettes">
        <h2 class="section-title">Tu paleta:</h2>
        <div id="container-paleta"></div>
        <div id="container-feedback"></div>
      </section>

      <div class="saved-palettes-modal" id="saved-palettes-modal">
        <div class="saved-palettes-content">
          <div class="saved-palettes-header">
            <h2 class="section-title">Paletas guardadas</h2>

            <button
              type="button"
              class="close-modal-button"
              id="close-modal-btn"
              aria-label="Cerrar paletas guardadas"
            >
              ×
            </button>
          </div>

          <div id="container-paletas-guardadas"></div>
        </div>
      </div>

      <div class="confirmation-modal" id="confirmation-modal">
        <div class="confirmation-content">
          <h2 class="section-title">Eliminar paleta</h2>

          <p class="confirmation-message">
            ¿Estás seguro de que deseas eliminar esta paleta?
          </p>

          <div class="confirmation-actions">
            <button type="button" class="cancel-button" id="cancel-delete-btn">
              Cancelar
            </button>

            <button
              type="button"
              class="confirm-delete-button"
              id="confirm-delete-btn"
            >
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>
        Generador de Paletas de Colores · Desarrollado por Maximiliano Lenta ·
        2026
      </p>
    </footer>
    <script src="./js/script.js"></script>
  </body>
</html>
